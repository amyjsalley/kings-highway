services:
  - type: web
    name: kings-highway
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kings-highway-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: FAMILY_CODE
        sync: false
      - key: AMY_CODE
        sync: false
      - key: VAPID_PUBLIC
        sync: false
      - key: VAPID_PRIVATE
        sync: false
      - key: TRIP_DATA
        sync: false
databases:
  - name: kings-highway-db
    plan: free
    region: virginia
    postgresMajorVersion: "17"
    databaseName: kings_highway_db
    user: kings_highway_db_user
